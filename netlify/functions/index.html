<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wanderly – Tour Guide</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--in:#ececef;--tx:#17171a;--mu:#6b6b75;--ac:#ff4560;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--card:#1e1e1e;--in:#1f1f1f;--tx:#fff;--mu:#a0a0a8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:22px 18px 110px}
h1{font-size:28px;margin:0 0 6px}h2{margin:0}h3{margin:0 0 6px}p.s{color:var(--mu);margin:0 0 16px}
input{width:100%;background:var(--in);color:var(--tx);border:0;border-radius:16px;padding:15px 18px;font:inherit;margin-bottom:10px}
.big{border-radius:40px;font-size:18px;padding:18px 24px}
.r{display:flex;gap:10px}.r>div{flex:1}label{font-size:13px;color:var(--mu);display:block;margin:0 0 4px}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.c{border:0;background:var(--in);color:var(--tx);padding:11px 18px;border-radius:30px;font:inherit;font-weight:600;cursor:pointer}
.c.on{background:var(--ac);color:#fff}
.go{width:100%;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;padding:17px;border-radius:40px;cursor:pointer}
.m{columns:2 220px;column-gap:14px}
.k{break-inside:avoid;background:var(--card);border-radius:18px;margin-bottom:14px;overflow:hidden}
.k .im{height:110px;display:flex;align-items:center;justify-content:center;font-size:44px}
.k .b{padding:12px 14px 14px}.k h3{font-size:16px;margin:0 0 4px}.k p{margin:0;color:var(--mu);font-size:14px}
.t{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;background:var(--in);padding:3px 10px;border-radius:20px}
.hl{outline:2px solid var(--ac)}
.sum{background:var(--card);border-radius:18px;padding:16px;margin:14px 0}
.hero{border-radius:22px;padding:26px 20px;margin:18px 0 0;color:#fff;text-shadow:0 1px 6px #0006}
.hero span{font-size:46px}.hero h2{font-size:30px}.hero small{opacity:.9}
.f{display:flex;gap:10px;margin:14px 0}.f>div{flex:1;background:var(--card);border-radius:16px;padding:12px;font-size:13px;color:var(--mu)}.f b{display:block;color:var(--tx);font-size:15px}
.bar{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:10px 0}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mu)}
a{color:var(--ac)}.er{color:var(--ac);font-weight:600}
.h{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.h small{color:var(--mu)}.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer;padding:6px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 14px #0003;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}nav button.on{color:var(--ac);font-weight:700}
</style></head><body><div class="w" id="app"></div><nav></nav>
<script>
const D={
madurai:{story:"Madurai is one of the oldest continuously inhabited cities in the world, a centre of Tamil culture for over two thousand years. It was the capital of the Pandya kings, and the Meenakshi Amman Temple became the heart of the city. The Nayak rulers later rebuilt much of it in the 16th–17th centuries, and the city still wakes and sleeps by the temple’s rhythm.",n:"Madurai",e:"🛕",sum:"Tamil Nadu’s ancient temple city, famous for the Meenakshi Amman Temple, late-night food streets and flower markets. Compact and easy to cover in 2–3 days.",best:"Oct–Mar (cooler, festival season)",
pl:[["Meenakshi Amman Temple","Towering gopurams and carved halls. Go early or after 5 pm.","heritage","🛕"],["Thirumalai Nayakkar Mahal","17th-century palace with grand arches; evening light show.","heritage","🏛️"],["Vandiyur Teppakulam","Large temple tank, calm at sunset.","nature","🌅"],["Gandhi Memorial Museum","Museum in a former palace with freedom-movement history.","heritage","🖼️"],["Alagar Koil","Hill temple north of town amid greenery.","nature","⛰️"],["Pudhu Mandapam & Markets","Tailoring stalls, jasmine and bargain shopping.","shopping","🛍️"]],
fd:[["Jigarthanda","Madurai’s signature cold milk-almond gum dessert drink.","food","🥤"],["Kari Dosa","Crisp dosa topped with spiced mutton mince.","food","🍳"],["Parotta & Salna","Flaky layered bread with spicy gravy; the late-night classic.","food","🫓"],["Murugan Idli Shop","Famous for soft idlis with many chutneys.","food","🍚"],["Paruthi Paal","Warm cottonseed milk, a local winter drink.","food","🥛"],["Amma Mess / Konar Mess","Non-veg meals the Madurai way.","food","🍗"]],
tr:"From Kerala: road via Theni–Kumily/Bodi from Munnar, or Kottayam–Kumily–Theni–Madurai; trains run from Kochi and Thiruvananthapuram to Madurai Junction. Local: autos, app cabs, walkable temple area."},
kochi:{story:"Kochi has been a spice-trade harbour for centuries, drawing Arab, Chinese, Portuguese, Dutch and British traders. Fort Kochi still shows these layers in its churches, palaces and fishing nets. It grew from a string of islands into Kerala’s busiest port city.",n:"Kochi",e:"⛵",sum:"Kerala’s harbour city: Chinese fishing nets, colonial Fort Kochi, spice markets and great seafood.",best:"Nov–Feb",
pl:[["Fort Kochi & Chinese Nets","Seafront walk at sunset.","nature","🎣"],["Mattancherry Palace","Dutch palace with Kerala murals.","heritage","🏰"],["Jew Town & Spice Market","Antique shops, spices, cafés.","shopping","🧂"],["Marine Drive","Evening promenade by the backwaters.","nature","🌇"],["Kathakali Show","Classical dance drama with makeup demo.","heritage","🎭"]],
fd:[["Karimeen Pollichathu","Pearl-spot fish wrapped in banana leaf.","food","🐟"],["Appam & Stew","Soft lacy rice pancakes with coconut stew.","food","🥞"],["Kerala Meals","Sadya-style rice meal on banana leaf.","food","🍛"],["Kayees-style Biryani","Local Malabar biryani.","food","🍚"]],
tr:"Metro and water metro in the city, buses, autos and app cabs. Ferries link Fort Kochi and Ernakulam."},
munnar:{story:"Munnar was a quiet hill region until British planters began growing tea here in the late 19th century. Today the estates define the landscape, and the hills are also home to the Nilgiri tahr and the rare Neelakurinji bloom, which flowers once every twelve years.",n:"Munnar",e:"🍃",sum:"Rolling tea estates and cool mountain air in the Western Ghats. Ideal for a slow 2–3 day nature break.",best:"Sep–Mar",
pl:[["Tea Gardens & Tea Museum","Walk estates and see how tea is made.","nature","🍵"],["Eravikulam National Park","Home of the Nilgiri tahr; book in advance.","nature","🐐"],["Mattupetty Dam","Boating and scenic views.","nature","🚤"],["Top Station","Panoramic viewpoint on the TN border.","nature","🌄"],["Spice Plantations","Cardamom, pepper and clove tours.","shopping","🌶️"]],
fd:[["Tapioca & Fish Curry","Kerala hill-country comfort food.","food","🍲"],["Fresh Tea & Homemade Chocolate","Buy at estate shops.","food","🍫"],["Kerala Parotta & Beef/Veg Curry","Staple local dinner.","food","🫓"]],
tr:"Road from Kochi (about 4–5 hrs) or via Theni/Madurai. Hire a taxi or jeep locally; hills are slow, plan buffer time."},
chennai:{story:"Chennai grew around Fort St George, founded by the British East India Company in 1639, but the region’s history goes back much further, with Pallava and Chola temples nearby. It is now the cultural capital of the South, known for music, dance and cinema.",n:"Chennai",e:"🌊",sum:"Tamil Nadu’s capital: long beaches, old temples, filter coffee and excellent South Indian food.",best:"Nov–Feb",
pl:[["Marina Beach","One of the longest urban beaches; go at sunrise.","nature","🏖️"],["Kapaleeshwarar Temple","Colourful Dravidian temple in Mylapore.","heritage","🛕"],["Fort St George & Museum","Early British fort in India.","heritage","🏰"],["T. Nagar","Sarees, jewellery, street shopping.","shopping","🛍️"],["Mahabalipuram (day trip)","Shore temples and rock carvings.","heritage","🗿"]],
fd:[["Filter Coffee","Strong decoction with frothy milk.","food","☕"],["Idli, Dosa, Pongal","Classic tiffin breakfast.","food","🍽️"],["Chettinad Meals","Spicy, aromatic regional cuisine.","food","🍛"],["Sundal on the Beach","Evening beach snack.","food","🥜"]],
tr:"Suburban trains, metro, buses and app cabs. Airport MAA; Chennai Central and Egmore for trains."}};
const ST={budget:[["Dorms / budget lodges","₹800–1,800 / night","🛏️"],["Homestays","₹1,200–2,200 / night","🏠"]],mid:[["3-star hotels","₹2,500–5,000 / night","🏨"],["Boutique / heritage stays","₹3,500–6,500 / night","🏡"]],comfort:[["4–5 star hotels","₹7,000–15,000 / night","🏩"],["Luxury resorts / palaces","₹10,000+ / night","🌴"]]};
const PD={budget:1500,mid:3500,comfort:8000},TN={budget:"Budget",mid:"Mid-range",comfort:"Comfortable"};
const $=s=>document.querySelector(s),app=$("#app");
const E=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const clean=v=>typeof v=="string"?E(v):Array.isArray(v)?v.map(clean):v&&typeof v=="object"?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,clean(x)])):v;
const hue=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let H=LS.get("wl_hist",[]),CF=LS.get("wl_set",{tier:"mid"});
const iso=d=>d.toISOString().slice(0,10);
const S={view:"home",tier:CF.tier||"mid",q:"",f:"",d1:iso(new Date()),d2:iso(new Date(Date.now()+864e5*3)),int:"food",c:null,busy:false,err:"",more:null,none:null};
const apply=h=>{Object.assign(S,{q:h.q,f:h.f,d1:h.d1,d2:h.d2,tier:h.tier,int:h.int});S.c=h.c};
if(H[0])apply(H[0]);
const find=q=>{q=q.trim().toLowerCase();return D[q]||(q.length>2&&Object.values(D).find(c=>c.n.toLowerCase().startsWith(q)))||null};
const keyOf=()=>[S.q.trim().toLowerCase(),S.f.trim().toLowerCase(),S.d1,S.d2,S.tier,S.int].join("|");
async function search(){if(!S.q.trim())return;const key=keyOf(),h=H.find(x=>x.key===key);
if(h){S.c=h.c;S.err="";S.view="home";return render()}
S.busy=true;S.err="";render();let c=null;
try{const r=await fetch("/.netlify/functions/guide",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({city:S.q,origin:S.f,from:S.d1,to:S.d2,tier:S.tier,interest:S.int})});
if(r.ok){const j=await r.json();if(j&&Array.isArray(j.pl)&&Array.isArray(j.fd))c=clean(j)}}catch(e){}
if(!c)c=find(S.q);S.busy=false;
if(c){S.c=c;H=[{key,ts:Date.now(),q:S.q.trim(),f:S.f,d1:S.d1,d2:S.d2,tier:S.tier,int:S.int,c},...H.filter(x=>x.key!==key)].slice(0,25);LS.set("wl_hist",H)}
else{S.c=null;S.err="We couldn’t load “"+S.q+"” right now. Please try again in a moment."}
S.view="home";render()}
async function more(sec){if(S.more||!S.c)return;const c=S.c;
if(sec==="st"&&!(Array.isArray(c.st)&&c.st.length))c.st=ST[S.tier].map(x=>[...x]);
const have=c[sec].map(x=>x[0]);S.more=sec;S.none=null;render();
try{const r=await fetch("/.netlify/functions/guide",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({section:sec,city:c.n,tier:S.tier,have:have.slice(0,100)})});
if(r.ok){const j=await r.json(),seen=new Set(have.map(x=>String(x).toLowerCase()));
const add=clean(j.items||[]).filter(x=>Array.isArray(x)&&x[0]&&!seen.has(String(x[0]).toLowerCase()));
c[sec].push(...add);if(!add.length)S.none=sec;LS.set("wl_hist",H)}}catch(e){}
S.more=null;render()}
function card(x){const h=hue(x[0]),m=S.int&&x[2]&&S.int.toLowerCase()===String(x[2]).toLowerCase();
return `<div class="k${m?" hl":""}"><div class="im" style="background:linear-gradient(135deg,hsl(${h} 70% 45%),hsl(${(h+50)%360} 75% 60%))">${x[3]||"📍"}</div><div class="b"><h3>${x[0]}</h3><p>${x[1]||""}</p>${x[2]?`<span class="t">${x[2]}</span>`:""}</div></div>`}
const days=()=>Math.max(1,Math.round((new Date(S.d2)-new Date(S.d1))/864e5)+1);
function form(){return `<h1>Where to?</h1><p class="s">Search a place and your dates. Get the story, places, food, stays and travel tips.</p>
<input class="big" id="q" placeholder="Search a city, e.g. Madurai" value="${E(S.q)}">
<div class="r"><div><label>From</label><input type="date" id="d1" value="${S.d1}"></div><div><label>To</label><input type="date" id="d2" value="${S.d2}"></div></div>
<input id="f" placeholder="Travelling from (e.g. Kerala)" value="${E(S.f)}">
<div class="ch">${Object.keys(TN).map(t=>`<button class="c${S.tier===t?" on":""}" data-t="${t}">${TN[t]}</button>`).join("")}</div>
<div class="ch">${["food","heritage","nature","shopping"].map(t=>`<button class="c${S.int===t?" on":""}" data-i="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
<button class="go" id="go">Show me the guide</button>`}
function summary(){const c=S.c,pd=Number(c.perDay)||PD[S.tier],d=days(),h=hue(c.n),sp={Stay:.4,Food:.25,Transport:.2,Activities:.15},col=["#ff4560","#ffa94d","#4dabf7","#69db7c"];
return `<div class="hero" style="background:linear-gradient(135deg,hsl(${h} 65% 40%),hsl(${(h+60)%360} 70% 55%))"><span>${c.e||"📍"}</span><h2>${c.n}</h2><small>${S.d1} to ${S.d2} · ${TN[S.tier]}</small></div>
<div class="sum"><h3>📜 The story of ${c.n}</h3><p style="margin:0">${c.story||c.sum||""}</p></div>
<div class="f"><div>Best time<b>${c.best||"–"}</b></div><div>Per day<b>₹${pd.toLocaleString("en-IN")}</b></div><div>${d} day${d>1?"s":""} total<b>₹${(pd*d).toLocaleString("en-IN")}</b></div></div>
<div class="sum"><h3>💰 Budget split</h3><div class="bar">${Object.values(sp).map((v,i)=>`<div style="width:${v*100}%;background:${col[i]}"></div>`).join("")}</div><div class="lg">${Object.entries(sp).map(([k,v],i)=>`<span><span style="color:${col[i]}">●</span> ${k} ₹${Math.round(pd*d*v).toLocaleString("en-IN")}</span>`).join("")}</div><p class="s" style="margin:10px 0 0;font-size:13px">Per-person estimates, prices may vary.</p></div>`}
function home(){return form()+(S.busy?`<p class="s" style="margin-top:30px">✨ Building your guide…</p>`:S.err?`<p class="er">${E(S.err)}</p>`:S.c?summary():`<p class="s" style="margin-top:24px">Popular: ${Object.values(D).map(c=>`<a href="#" data-c="${c.n}">${c.e} ${c.n}</a>`).join(" · ")}</p>`)}
function list(title,items,sec){if(!S.c)return `<h1>${title}</h1><p class="s">Search a place on Home first.</p><button class="go" data-v="home">Go to Home</button>`;
return `<h1>${title}</h1><p class="s">${S.c.n} · <b>${items.length}</b> found</p><div class="m">${items.map(card).join("")}</div>${sec?`<button class="c" data-more="${sec}" style="display:block;margin:6px auto 0">${S.more===sec?"Loading…":S.none===sec?"No more found":"Load more"}</button>`:""}`}
function view(){const c=S.c;
if(S.view==="home")return home();
if(S.view==="places")return list("Places to visit",c?c.pl:[],"pl");
if(S.view==="food")return list("Food",c?c.fd:[],"fd");
if(S.view==="stay")return list("Places to stay",c?(Array.isArray(c.st)&&c.st.length?c.st:ST[S.tier]).map(x=>[x[0],x[1],TN[S.tier],x[2]]):[],"st");
if(S.view==="travel")return !c?list("Travel",[]):`<h1>Travel</h1><p class="s">${c.n}</p><div class="sum">🚆 ${c.tr||""}</div>${S.f?`<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/${encodeURIComponent(S.f)}/${encodeURIComponent(c.n)}">Route from ${E(S.f)} on Google Maps</a></p>`:""}`;
return `<h1>Settings</h1><p class="s">Default budget</p><div class="ch">${Object.keys(TN).map(t=>`<button class="c${CF.tier===t?" on":""}" data-d="${t}">${TN[t]}</button>`).join("")}</div>
<h3 style="margin-top:22px">History</h3>${H.length?H.map((h,i)=>`<div class="h" data-o="${i}"><div><b>${E(h.q)}</b><br><small>${h.d1} to ${h.d2} · ${TN[h.tier]} · ${new Date(h.ts).toLocaleDateString()}</small></div><button class="x" data-x="${i}" aria-label="Delete">✕</button></div>`).join("")+`<button class="c" id="clr" style="margin-top:6px">Clear history</button>`:`<p class="s">No searches yet.</p>`}
<p class="s" style="margin-top:24px;font-size:13px">History is saved on this device only.</p>`}
const NAV=[["home","🏠","Home"],["places","🏛️","Places"],["food","🍜","Food"],["stay","🛏️","Stay"],["travel","🚆","Travel"],["settings","⚙️","Settings"]];
function render(){app.innerHTML=view();
document.querySelector("nav").innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${S.view===n[0]?"on":""}"><span>${n[1]}</span>${n[2]}</button>`).join("");
const q=$("#q");if(q){q.oninput=e=>S.q=e.target.value;q.onkeydown=e=>{if(e.key==="Enter")search()};$("#f").oninput=e=>S.f=e.target.value;$("#d1").onchange=e=>S.d1=e.target.value;$("#d2").onchange=e=>S.d2=e.target.value;$("#go").onclick=search}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tier=b.dataset.t;render()});
document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.int=b.dataset.i;render()});
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=e=>{e.preventDefault();S.q=b.dataset.c;search()});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();scrollTo(0,0)});
document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>more(b.dataset.more));
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{CF.tier=b.dataset.d;S.tier=CF.tier;LS.set("wl_set",CF);render()});
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=e=>{e.stopPropagation();H.splice(+b.dataset.x,1);LS.set("wl_hist",H);render()});
document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{apply(H[+b.dataset.o]);S.view="home";render();scrollTo(0,0)});
const cl=$("#clr");if(cl)cl.onclick=()=>{H=[];LS.set("wl_hist",H);render()}}
render();
</script></body></html>
